name: Build Android APK
on:
  workflow_dispatch: # Biar proses build bisa diklik manual

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Java (Untuk Android SDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build APK Flet
        run: flet build apk

      - name: Upload Hasil APK
        uses: actions/upload-artifact@v4
        with:
          name: Trading-Bot-APK
          path: build/apk/**/*.apk
